name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: borderless
          POSTGRES_PASSWORD: borderless
          POSTGRES_DB: borderless_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U borderless"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Supplying these makes the test suite use the service containers above
      # instead of spinning up its own via testcontainers.
      TEST_DATABASE_URL: postgresql://borderless:borderless@localhost:5432/borderless_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://borderless:borderless@localhost:5432/borderless_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: corepack enable
      - run: yarn install --immutable

      - run: yarn prisma:generate

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: OpenAPI spec is in sync with the code
        run: yarn docs:check
